<html lang="en">

<head>
  <title>My BCIT Project</title>

  <!-- Required meta tags -->
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />

  <!-- Other libraries go here -->
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://getbootstrap.com/docs/5.3/assets/css/docs.css" rel="stylesheet" />
  <!-- Bootstrap Icons: the profile page uses bi-person-fill, bi-pencil, bi-heart-fill, etc. -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <!-- <link href="https://cdn.jsdelivr.net/npm/@mdi/font@7.4.47/css/materialdesignicons.min.css" rel="stylesheet" /> -->
  <!-- <link href="./styles/style.css" rel="stylesheet" /> -->
</head>

<body>
  <!------------------------------>
  <!-- Your HTML Layout go here -->
  <!------------------------------>
  <!-- Stuff for body goes here -->

  <!---------------------------------------------->
  <!-- Your own JavaScript functions go here    -->
  <!---------------------------------------------->

  <site-navbar></site-navbar>
  <script type="module" src="/src/components/siteNavbar.js"></script>


  <!-- <main-content></main-content> -->
  <main class="container py-4" style="max-width: 720px;">
        <!-- Header: avatar + name + email -->
        <div class="d-flex align-items-center gap-3 mb-4">
            <div id="avatar" class="rounded-circle bg-warning fw-bold fs-3 d-flex align-items-center justify-content-center"
                 style="width: 64px; height: 64px;">?</div>
            <div>
                <h1 id="profileName" class="h3 mb-0">My profile</h1>
                <small id="profileEmail" class="text-muted"></small>
            </div>
        </div>

        <!-- Section 1: About me -->
        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <h2 class="h5 card-title mb-3"><i class="bi bi-person-fill me-1"></i>About me</h2>
                <div id="profileAlert" class="alert alert-success d-none" role="alert"></div>

                <form id="profileForm" novalidate>
                    <div class="mb-3">
                        <label for="nameInput" class="form-label">Name</label>
                        <input type="text" id="nameInput" class="form-control" disabled />
                    </div>
                    <div class="mb-3">
                        <label for="countryInput" class="form-label">Country</label>
                        <input type="text" id="countryInput" class="form-control" disabled />
                    </div>
                    <div class="mb-3">
                        <label for="schoolInput" class="form-label">School</label>
                        <input type="text" id="schoolInput" class="form-control" disabled />
                    </div>
                    <div class="mb-3">
                        <label for="bioInput" class="form-label">About me</label>
                        <textarea id="bioInput" class="form-control" rows="3" disabled></textarea>
                    </div>
                    <button type="button" id="editBtn" class="btn btn-outline-secondary">
                        <i class="bi bi-pencil me-1"></i>Edit
                    </button>
                    <button type="submit" id="saveBtn" class="btn btn-success" disabled>
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                </form>
            </div>
        </div>

        <!-- Section 2: Notifications -->
        <div class="card shadow-sm mb-5">
            <div class="card-body">
                <h2 class="h5 card-title mb-3"><i class="bi bi-bell-fill me-1"></i>Notifications</h2>
                <div id="notificationAlert" class="alert d-none" role="alert"></div>

                <form id="notificationForm" novalidate>
                    <div class="form-check form-switch mb-3">
                        <input class="form-check-input" type="checkbox" role="switch" id="notificationsEnabledInput" />
                        <label class="form-check-label" for="notificationsEnabledInput">Daily puzzle reminders</label>
                    </div>
                    <div class="mb-3">
                        <label for="reminderTimeInput" class="form-label">Remind me at</label>
                        <input type="time" id="reminderTimeInput" class="form-control" value="18:00" />
                        <div class="form-text">Uses your device's current time zone.</div>
                    </div>
                    <button type="submit" id="saveNotificationsBtn" class="btn btn-success">
                        <i class="bi bi-check-lg me-1"></i>Save
                    </button>
                </form>
            </div>
        </div>

        <!-- Section 3: My favourite puzzles -->
        <h2 class="h5 mb-3"><i class="bi bi-heart-fill text-danger me-1"></i>My favourite puzzles</h2>
        <div id="puzzles-go-here" class="row row-cols-1 row-cols-md-2 g-3"></div>

    </main>

  <!-- Card template for the favourites list (same structure as the one in main.html) -->
  <template id="puzzleCardTemplate">
    <div class="col">
      <div class="card h-100">
        <div class="card-body d-flex flex-column">
          <h5 class="card-title"></h5>
          <p class="card-text"></p>
          <p>Difficulty: <span class="badge card-difficulty"></span></p>
          <a class="btn btn-primary mt-auto play-btn" href="sudoku.html">Play</a>
        </div>
      </div>
    </div>
  </template>

  <!-- Profile logic. Must come after the markup it reads; type="module" also defers it. -->
  <script type="module" src="/src/profile.js"></script>


  <div class="container">
    <footer class="d-flex flex-wrap justify-content-between align-items-center py-3 my-4 border-top">
      <p class="col-md-4 mb-0 text-body-secondary">© 2026 BBY19 Burnaby</p>
      <a href="/"
        class="col-md-4 d-flex align-items-center justify-content-center mb-3 mb-md-0 me-md-auto link-body-emphasis text-decoration-none"
        aria-label="Bootstrap">
        <svg class="bi me-2" width="40" height="32" aria-hidden="true">
          <use xlink:href="#bootstrap"></use>
        </svg>
      </a>
      <ul class="nav col-md-4 justify-content-end">
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-body-secondary">Home</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-body-secondary">Puzzles</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-body-secondary">Daily Motivation</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-body-secondary">About</a>
        </li>
        <li class="nav-item">
          <a href="#" class="nav-link px-2 text-body-secondary">FAQs</a>
        </li>
      </ul>
    </footer>
  </div>
</body>

</html>
