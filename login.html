<!doctype html>
<html lang="en">

<head>
  <title>Doomscroll - Login</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./styles/style.css" rel="stylesheet" />
  <script type="module" src="/src/loginSignup.js"></script>
</head>

<body>
  <nav class="navbar navbar-expand-lg bg-body-tertiary">
    <div class="container">
      <a class="navbar-brand fw-semibold" href="index.html">Doomscroll</a>
      <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarSupportedContent"
        aria-controls="navbarSupportedContent" aria-expanded="false" aria-label="Toggle navigation">
        <span class="navbar-toggler-icon"></span>
      </button>
      <div class="collapse navbar-collapse" id="navbarSupportedContent">
        <ul class="navbar-nav me-auto mb-2 mb-lg-0">
          <li class="nav-item"><a class="nav-link" href="timeSpent.html">Time Spent</a></li>
          <li class="nav-item"><a class="nav-link" href="motivation.html">Motivation</a></li>
          <li class="nav-item"><a class="nav-link" href="streak.html">Daily Streak</a></li>
        </ul>
      </div>
    </div>
  </nav>

  <main class="container">
    <section class="page-card text-start">
      <div id="authAlert" class="alert alert-danger d-none" role="alert"></div>

      <div id="loginView">
        <h1 class="h3 mb-3 text-center">Login</h1>
        <form id="loginForm" novalidate>
          <div class="mb-3">
            <label for="loginEmail" class="form-label">Email</label>
            <input type="email" id="loginEmail" class="form-control" autocomplete="email" required />
          </div>
          <div class="mb-3">
            <label for="loginPassword" class="form-label">Password</label>
            <input type="password" id="loginPassword" class="form-control" autocomplete="current-password" required />
          </div>
          <button type="submit" class="btn btn-primary w-100">Login</button>
        </form>
        <p class="mt-3 mb-0 text-center small">
          Don't have an account? <a href="#" id="toSignup">Sign up</a>
        </p>
      </div>

      <div id="signupView" class="d-none">
        <h1 class="h3 mb-3 text-center">Sign Up</h1>
        <form id="signupForm" novalidate>
          <div class="mb-3">
            <label for="signupName" class="form-label">First and last name</label>
            <input type="text" id="signupName" class="form-control" autocomplete="name" required />
          </div>
          <div class="mb-3">
            <label for="signupEmail" class="form-label">Email</label>
            <input type="email" id="signupEmail" class="form-control" autocomplete="email" required />
          </div>
          <div class="mb-3">
            <label for="signupPassword" class="form-label">Password</label>
            <input type="password" id="signupPassword" class="form-control" autocomplete="new-password" minlength="6"
              required />
          </div>
          <button type="submit" class="btn btn-success w-100">Create Account</button>
        </form>
        <p class="mt-3 mb-0 text-center small">
          Already have an account? <a href="#" id="toLogin">Login</a>
        </p>
      </div>
    </section>
  </main>

  <div class="container">
    <footer class="d-flex justify-content-between align-items-center py-3 my-4 border-top">
      <p class="mb-0 text-body-secondary">&copy; 2026 BBY19 Burnaby</p>
    </footer>
  </div>
</body>

</html>
