<!doctype html>
<html lang="en">
<head>
  <title>Doomscroll - Friends</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet" />
  <link href="./styles/style.css" rel="stylesheet" />
</head>

<body>
  <site-navbar></site-navbar>
  <script type="module" src="/src/components/siteNavbar.js"></script>

  <main class="container py-4" style="max-width: 720px;">
    <h1 class="h3 mb-4"><i class="bi bi-people-fill me-1"></i>Friends</h1>

    <!-- Add a friend by email -->
    <div class="card shadow-sm mb-4">
      <div class="card-body">
        <h2 class="h5 card-title mb-1">Add a friend</h2>
        <p class="text-body-secondary small mb-3">They'll get a request. You'll see each other's progress once they accept.</p>
        <form id="addFriendForm" class="d-flex gap-2" novalidate>
          <label for="friendEmailInput" class="visually-hidden">Friend's email</label>
          <input type="email" id="friendEmailInput" class="form-control" placeholder="friend@example.com" required />
          <button type="submit" id="addFriendBtn" class="btn btn-primary text-nowrap">
            <i class="bi bi-person-plus-fill me-1"></i>Add
          </button>
        </form>
        <div id="socialAlert" class="alert d-none mt-3 mb-0" role="alert"></div>
      </div>
    </div>

    <!-- Requests sent to me -->
    <section id="incomingSection" class="mb-4 d-none">
      <h2 class="h5 mb-3"><i class="bi bi-envelope-fill me-1"></i>Friend requests</h2>
      <ul id="incomingList" class="list-group shadow-sm"></ul>
    </section>

    <!-- Requests I sent that are still waiting -->
    <section id="outgoingSection" class="mb-4 d-none">
      <h2 class="h6 mb-2 text-body-secondary">Waiting for them to accept</h2>
      <ul id="outgoingList" class="list-group"></ul>
    </section>

    <!-- Friends' tracks -->
    <h2 class="h5 mb-3">Your friends' progress</h2>
    <p id="friendsEmpty" class="text-body-secondary">Loading…</p>
    <div id="friends-go-here" class="row row-cols-1 row-cols-md-2 g-3"></div>
  </main>

  <template id="friendCardTemplate">
    <div class="col">
      <div class="card h-100 shadow-sm">
        <div class="card-body d-flex flex-column">
          <div class="d-flex align-items-center gap-2 mb-3">
            <div class="friend-avatar rounded-circle bg-warning fw-bold d-flex align-items-center justify-content-center"
              style="width: 40px; height: 40px;">?</div>
            <div class="text-truncate">
              <h3 class="h6 mb-0 friend-name"></h3>
              <small class="text-muted friend-email"></small>
            </div>
          </div>
          <ul class="list-unstyled mb-3">
            <li><i class="bi bi-fire text-danger me-1"></i>Streak: <strong class="friend-streak">0</strong> days</li>
            <li><i class="bi bi-trophy-fill text-warning me-1"></i>Best streak: <strong class="friend-best">0</strong></li>
            <li><i class="bi bi-clock-fill text-primary me-1"></i>This week: <strong class="friend-week">0h 00m</strong></li>
            <li><i class="bi bi-hourglass-split me-1"></i>All time: <strong class="friend-total">0h 00m</strong></li>
            <li class="text-muted small mt-1">Last played: <span class="friend-last">never</span></li>
          </ul>
          <button type="button" class="btn btn-outline-danger btn-sm mt-auto remove-btn">
            <i class="bi bi-person-dash me-1"></i>Remove
          </button>
        </div>
      </div>
    </div>
  </template>

  <script type="module" src="/src/social.js"></script>

  <div class="container">
    <footer class="d-flex justify-content-between align-items-center py-3 my-4 border-top">
      <p class="mb-0 text-body-secondary">&copy; 2026 BBY19 Burnaby</p>
    </footer>
  </div>
</body>

</html>
