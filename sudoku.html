<!DOCTYPE html>
<html lang="en">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Sudoku</title>
</head>

<body class="m-0 p-0">
  <site-navbar></site-navbar>
  <script type="module" src="/src/components/siteNavbar.js"></script>
  <div class="d-flex justify-content-center align-items-center flex-column gap-5 min-vh-100">
    <div class="text-center">
      <label for="difficulty-select" class="form-label">Difficulty</label>
      <select id="difficulty-select" class="form-select w-auto mx-auto mb-3" disabled>
        <option value="easy">Easy</option>
        <option value="medium">Medium</option>
        <option value="hard">Hard</option>
      </select>
      <div id="timer-display" class="fs-2 fw-bold" aria-live="polite">00:00</div>
      <div class="d-flex gap-2 justify-content-center">
        <button id="timer-start" class="btn btn-success">Start</button>
        <button id="timer-pause" class="btn btn-warning">Pause</button>
        <button id="timer-stop" class="btn btn-danger">Stop &amp; save</button>
      </div>
      <div id="timer-status" class="small mt-2" role="status"></div>
    </div>
    <div class="d-flex justify-content-center align-items-center">
      <div id="sudoku-board" class="d-grid">
        <!-- Box content -->
      </div>
    </div>
    <div id="number-pad" class="d-grid">
      <button class="btn btn-light border rounded-0">1</button>
      <button class="btn btn-light border rounded-0">2</button>
      <button class="btn btn-light border rounded-0">3</button>
      <button class="btn btn-light border rounded-0">4</button>
      <button class="btn btn-light border rounded-0">5</button>
      <button class="btn btn-light border rounded-0">6</button>
      <button class="btn btn-light border rounded-0">7</button>
      <button class="btn btn-light border rounded-0">8</button>
      <button class="btn btn-light border rounded-0">9</button>
    </div>
  </div>
  <nav class="app-navbar" aria-label="Main navigation">
    <a class="app-navbar_item" href="#social">
      <span class="app-navbar_icon mdi mdi-account-multiple" aria-hidden="true"></span>
      <span>Social</span>
    </a>
    <a class="app-navbar_item" href="index.html">
      <span class="app-navbar_icon mdi mdi-home" aria-hidden="true"></span>
      <span>Home</span>
    </a>
    <a class="app-navbar_item" href="sudoku.html" aria-current="page">
      <span class="app-navbar_icon mdi mdi-puzzle" aria-hidden="true"></span>
      <span>My Puzzles</span>
    </a>
  </nav>
  <script type="module" src="./src/sudoku.js"></script>
  <script type="module" src="./src/progress.js"></script>
</body>

</html>
