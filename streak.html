<!doctype html>
<html lang="en">
<head>
  <title>Doomscroll - Daily Streak</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <script defer src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"></script>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css" rel="stylesheet" />
  <link href="./styles/style.css" rel="stylesheet" />
</head>

<body>
  <site-navbar></site-navbar>
  <script type="module" src="/src/components/siteNavbar.js"></script>

  <main class="container">
    <section class="page-card">
      <h1 class="h3">Daily streak</h1>
      <p id="streak-count" class="big-number">0</p>
      <p class="text-body-secondary">days in a row</p>
      <div class="streak-days">
        <span class="streak-day">M</span>
        <span class="streak-day">T</span>
        <span class="streak-day">W</span>
        <span class="streak-day">T</span>
        <span class="streak-day">F</span>
        <span class="streak-day">S</span>
        <span class="streak-day">S</span>
      </div>
      <div id="best-streak" class="placeholder-box">Best streak: --</div>
      <div class="placeholder-box">Rewards / badges go here</div>
    </section>
  </main>
  <script type="module" src="/src/streak.js"></script>

  <div class="container">
    <footer class="d-flex justify-content-between align-items-center py-3 my-4 border-top">
      <p class="mb-0 text-body-secondary">&copy; 2026 BBY19 Burnaby</p>
    </footer>
  </div>
</body>

</html>
